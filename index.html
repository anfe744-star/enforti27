<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT 2.5 - GOOGLE SIGN IN</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="google-signin-client_id" content="1055307236512-1119qji34gnpqavq8shf4pbbo0dvksnq.apps.googleusercontent.com">
    
    <!-- Tipografia moderna de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.2) 0px, transparent 50%);
            color: #f8fafc;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Cercles decoratius animats al fons */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.4);
            top: 10%;
            left: 15%;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: rgba(14, 165, 233, 0.35);
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* Targeta principal estil Glassmorphism */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 44px 36px;
            text-align: center;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Missatge de benvinguda */
        #missatge-benvinguda {
            font-size: 1.35rem;
            font-weight: 600;
            color: #f8fafc;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(56, 189, 248, 0.15));
            border: 1px solid rgba(52, 211, 153, 0.35);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.15);
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Contenidor per centrar el botó de Google */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .g_id_signin {
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .g_id_signin:hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
        }

        /* Botó de desconnectar */
        #boto-sortir {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
        }

        #boto-sortir:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 25px -5px rgba(239, 68, 68, 0.55);
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
        }

        #boto-sortir:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <!-- Elements decoratius de fons -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Targeta principal -->
    <main class="card">
        <span class="badge">Autenticació Segura</span>
        <h1>PT 2.5 - GOOGLE SIGN IN</h1>
        <p>Pàgina preparada per afegir el OAuth 2.</p>
        
        <h2 id="missatge-benvinguda" style="display:none;">Missatge de benvinguda</h2>

        <div class="auth-container">
            <div id="g_id_onload"
             data-client_id="1055307236512-1119qji34gnpqavq8shf4pbbo0dvksnq.apps.googleusercontent.com"
             data-callback="onSignIn">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-size="large" data-shape="pill"></div>
            
            <button id="boto-sortir" style="display:none;" onclick="signOut()">Desconnectar</button>
        </div>

        <div class="footer-note">
            Protegit amb Google Identity Services
        </div>
    </main>

    <script>
    function onSignIn(response) {
        var id_token = response.credential;
        console.log("ID Token: " + id_token);

        const dades = JSON.parse(decodeURIComponent(escape(atob(
            id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));

        const missatge = document.getElementById('missatge-benvinguda');
        missatge.textContent = "Benvingut/da, " + dades.name + " 👋";
        missatge.style.display = 'block';

        document.getElementById('boto-sortir').style.display = 'block';
        document.querySelector('.g_id_signin').style.display = 'none';
    }

    function signOut() {
        document.getElementById('missatge-benvinguda').style.display = 'none';
        document.getElementById('boto-sortir').style.display = 'none';
        document.querySelector('.g_id_signin').style.display = 'block';
    }
    </script>
</body>
</html>
